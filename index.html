<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1215" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MackroBytes">
  <title>MackroBytes</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<section id="login" class="center-screen" hidden>
  <form id="loginForm" class="login" autocomplete="on">
    <h2>Sign in to MackroBytes</h2>
    <label class="f">Email<input id="loginEmail" type="email" autocomplete="username" required></label>
    <label class="f">Password<input id="loginPw" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">Sign in</button>
    <p id="loginErr" class="err" hidden></p>
  </form>
</section>

<div class="wrap">
  <header class="top">
    <div class="brand">MackroBytes</div>
    <span class="note" id="previewNote" hidden>Preview: changes stay in this browser</span>
    <span class="err" id="syncErr" hidden>Sync stopped. Reload the app.</span>
    <button class="gear" data-act="settings" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M5.5 18.5l2.1-2.1M16.4 7.6l2.1-2.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  </header>
  <section class="summary">
    <div><div class="label">Your payouts</div><div class="main" id="payouts">$0.00</div></div>
    <div class="side"><div>Buyers paid <span id="paidTotal">$0.00</span></div><div id="estNote"></div></div>
  </section>
  <div class="tools">
    <input id="search" type="search" placeholder="Search SKU or name" autocomplete="off" aria-label="Search SKU or name">
    <button class="btn" data-act="add">Add item</button>
    <button class="btn primary" data-act="sale">Record sale</button>
  </div>
  <nav class="tabbar" id="tabs" aria-label="Status"></nav>
  <main id="list"><div class="empty">Loading your shop…</div></main>
</div>

<div id="scrim" hidden><aside id="panel"></aside></div>
<div id="toast" class="toast" role="status" hidden></div>
<input type="file" id="fileIn" accept="image/*,.heic,.heif" multiple hidden>

<script src="config.js"></script>
<script>
  // Only load the database library once config.js has real values; otherwise the app runs as a local preview.
  if (window.CONFIG && CONFIG.SUPABASE_URL && !CONFIG.SUPABASE_URL.startsWith("YOUR")) {
    document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js" integrity="sha384-xPW3QHswsICVC2mW6BFNwMbhpLkbZ133fKOhxNx3QGGgAOJfL3O9t8r2aWn1aez6" crossorigin="anonymous"><\/script><script src="store.js"><\/script>');
  }
</script>
<script src="app.js"></script>
<script>if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});</script>
</body>
</html>
